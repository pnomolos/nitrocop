schema: 1
cop: "Style/TimeNow"
matchers:
  time_new:
    pattern: |
      (call (const {nil? cbase} :Time) :new)
hooks:
  - on: [send]
    match: time_new
    offense:
      location: node
      message: "Prefer `Time.now`."
      correct:
        - { op: replace, range: { start: node.selector.start, stop: node.expression.stop }, text: "now" }
