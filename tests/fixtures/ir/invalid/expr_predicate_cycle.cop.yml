schema: 1
cop: "Style/TimeNow"
matchers:
  time_new:
    pattern: |
      (call (const {nil? cbase} :Time) :new)
predicates:
  alpha:
    expr: { matches: [node, "beta"] }
  beta:
    expr: { matches: [node, "alpha"] }
hooks:
  - on: [send]
    match: time_new
    offense:
      location: node
      message: "Prefer `Time.now`."
