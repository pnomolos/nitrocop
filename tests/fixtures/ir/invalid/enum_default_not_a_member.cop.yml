schema: 1
cop: "Style/TimeNow"
config:
  EnforcedStyle: { type: enum, values: ["is_a?", "kind_of?"], default: "instance_of?" }
matchers:
  time_new:
    pattern: |
      (call (const {nil? cbase} :Time) :new)
hooks:
  - on: [send]
    match: time_new
    offense:
      location: node
      message: "Prefer `Time.now`."
